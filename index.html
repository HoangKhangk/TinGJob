<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinGJob - Kết nối cơ hội việc làm</title>
    <meta name="description"
        content="TinGJob - Nền tảng tuyển dụng hàng đầu Việt Nam. Theo dõi chúng tôi trên TikTok, YouTube và Facebook.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background -->
    <div class="bg-animation">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
        <div class="bg-orb bg-orb-3"></div>
        <div class="bg-orb bg-orb-4"></div>
    </div>

    <!-- Floating particles -->
    <canvas id="particleCanvas"></canvas>

    <main class="container">
        <!-- Profile Section -->
        <section class="profile" id="profile-section">
            <div class="avatar-wrapper">
                <div class="avatar-ring"></div>
                <img src="tingjob.png" alt="TinGJob Logo" class="avatar" id="avatar-img">
            </div>
            <h1 class="brand-name" id="brand-name">
                <span class="brand-ting">Ting</span><span class="brand-g">G</span><span class="brand-job">Job</span>
            </h1>
            <p class="tagline" id="tagline">Kết nối cơ hội việc làm hàng đầu Việt Nam</p>

        </section>

        <!-- Links Section -->
        <section class="links" id="links-section">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@tingjob.vn" target="_blank" rel="noopener noreferrer" class="link-card"
                id="link-tiktok">
                <div class="link-icon-wrapper tiktok-bg">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1v-3.5a6.37 6.37 0 0 0-.79-.05A6.34 6.34 0 0 0 3.15 15a6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.34-6.34V8.71a8.24 8.24 0 0 0 4.76 1.49v-3.5a4.85 4.85 0 0 1-1-.01z" />
                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">TikTok</span>
                    <span class="link-subtitle">@tingjob.vn</span>
                </div>
                <div class="link-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
                <div class="link-shine"></div>
            </a>

            <!-- YouTube -->
            <a href="https://www.youtube.com/@TinGJob" target="_blank" rel="noopener noreferrer" class="link-card"
                id="link-youtube">
                <div class="link-icon-wrapper youtube-bg">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z" />
                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">YouTube</span>
                    <span class="link-subtitle">@TinGJob</span>
                </div>
                <div class="link-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
                <div class="link-shine"></div>
            </a>

            <!-- Facebook -->
            <a href="https://www.facebook.com/tingjob.vn?locale=vi_VN" target="_blank" rel="noopener noreferrer"
                class="link-card" id="link-facebook">
                <div class="link-icon-wrapper facebook-bg">
                    <svg class="link-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
                    </svg>
                </div>
                <div class="link-content">
                    <span class="link-title">Facebook</span>
                    <span class="link-subtitle">TinGJob Việt Nam</span>
                </div>
                <div class="link-arrow">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12h14M12 5l7 7-7 7" />
                    </svg>
                </div>
                <div class="link-shine"></div>
            </a>
        </section>

        <!-- Footer -->
        <footer class="footer" id="footer">
            <p>© 2026 TinGJob. Tất cả quyền được bảo lưu.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>

</html>
